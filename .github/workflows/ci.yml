name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test iOS app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        # v6 uses Node 24 and avoids GitHub's Node 20 action deprecation.
        uses: actions/checkout@v6

      - name: Generate Xcode project
        run: ./scripts/generate_project.sh

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project schemes
        run: xcodebuild -list -project EorzeaToolkit.xcodeproj

      # Cross-file invariants only. Whether each file still decodes into its model is asserted
      # against the real types in BundledDataTests, not restated as a schema here. Runs before
      # the build because it costs a fraction of a second and fails on data the build cannot.
      - name: Validate bundled data
        run: python3 scripts/validate_data.py

      - name: Build
        run: |
          xcodebuild build \
            -project EorzeaToolkit.xcodeproj \
            -scheme EorzeaToolkit \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO

      # Reuses the DerivedData the build step just produced. Resolving a simulator udid is
      # left to the script so CI and a developer Mac run the tests exactly the same way.
      - name: Test
        run: ./scripts/run_tests.sh

      # The app target sets SWIFT_EMIT_LOC_STRINGS, so every build extracts localizable strings
      # and syncs them back into the tracked catalog. Running last means this covers everything
      # the build and the tests wrote. A clean build must leave the file untouched; a diff here
      # means the committed catalog disagrees with what the source actually declares.
      - name: Verify the string catalog is in sync
        run: |
          catalog=EorzeaToolkit/Localization/Localizable.xcstrings

          if git diff --quiet -- "$catalog"; then
            echo "$catalog is unchanged."
            exit 0
          fi

          echo "::error::$catalog changed during the build."
          echo "Entries added: the source declares strings the committed catalog lacks. Either a"
          echo "new string was committed without its entry, or the committed catalog came from a"
          echo "build that did not compile every file. Rebuild from clean and commit the result."
          echo "Entries removed or marked stale: the committed catalog keeps strings the source no"
          echo "longer declares. Commit the catalog a local build produces. If the code looks a"
          echo "key up at runtime, mark that key manual instead."
          git diff --stat -- "$catalog"
          git diff -- "$catalog"
          exit 1
