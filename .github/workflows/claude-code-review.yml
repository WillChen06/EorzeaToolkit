name: Claude Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        # v6 uses Node 24 and avoids GitHub's Node 20 action deprecation.
        # Full history is required to diff against the previously reviewed commit.
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve review base
        id: review-base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          mode=full
          base=""
          reason=""

          if [ "$EVENT_ACTION" = "synchronize" ]; then
            # Previous runs record the reviewed head SHA in their summary comment. The marker
            # only advances when a review actually finished, so commits pushed while a run was
            # cancelled by cancel-in-progress stay inside the next incremental diff.
            # A `gh api` failure leaves last_sha empty and falls back to a full review on purpose.
            last_sha="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]") | .body' \
              | grep -oE 'claude-reviewed: [0-9a-f]{40}' \
              | tail -n 1 | awk '{print $2}' || true)"

            if [ -z "$last_sha" ]; then
              reason="no previous review marker found"
            elif ! git cat-file -e "${last_sha}^{commit}" 2>/dev/null; then
              reason="previously reviewed commit ${last_sha} no longer exists (force push?)"
            elif ! git merge-base --is-ancestor "$last_sha" "$HEAD_SHA" 2>/dev/null; then
              reason="previously reviewed commit ${last_sha} is not an ancestor of HEAD (rebase?)"
            elif [ "$last_sha" = "$HEAD_SHA" ]; then
              reason="HEAD is already reviewed"
            else
              mode=incremental
              base="$last_sha"
              reason="reviewing commits after ${last_sha}"
            fi
          else
            reason="event is ${EVENT_ACTION}"
          fi

          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "Review mode: ${mode} (${reason})" >> "$GITHUB_STEP_SUMMARY"

      - name: Normalize Claude OAuth token
        id: claude-token
        env:
          RAW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          token="$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n')"
          if [ -z "$token" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is empty after normalization" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Claude review
        # Pinned from anthropics/claude-code-action@v1 for supply-chain safety.
        uses: anthropics/claude-code-action@dde2242db6af13460b916652159b6ba19a598f30
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ steps.claude-token.outputs.token }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            REVIEW MODE: ${{ steps.review-base.outputs.mode }}
            REVIEW BASE: ${{ steps.review-base.outputs.base }}

            Review this pull request for correctness, maintainability, SwiftUI best practices, data handling, localization regressions, and security issues.

            Scope (read this first):
            - REVIEW MODE `full`: review the whole PR diff via `gh pr diff <PR NUMBER>`.
            - REVIEW MODE `incremental`: review ONLY what changed after REVIEW BASE.
              - Changed files: `git diff --name-only <REVIEW BASE> <HEAD SHA>`
              - Diff to review: `git diff <REVIEW BASE> <HEAD SHA>`
              - You may still Read/Grep whole files and run `gh pr diff` for context, but every
                comment you leave must be about a line that appears in the incremental diff.
              - Do not re-summarise or re-review the earlier commits of this PR.

            Avoid duplicate feedback:
            - Before writing anything, read the existing discussion with `gh pr view <PR NUMBER> --comments`.
            - Never repeat an issue that a previous review already raised.
            - If a previously raised issue is fixed in this increment, acknowledge it in one line (`已修正`).
            - If a previously raised issue is still unresolved, only mention it again when the surrounding
              lines changed in this increment; otherwise leave it alone.

            Rules:
            - Do not modify files, create commits, push branches, approve, or merge.
            - Prefer concise, actionable feedback in Traditional Chinese.
            - If you find a concrete issue, leave an inline comment on the most relevant changed line when possible.
            - Always leave a final PR comment with `gh pr comment`, even when no fix is needed.
            - If no fix is needed, say that explicitly and mention any residual test/build risk.
            - Include whether the CI build result was visible to you.

            Final comment format:
            - Start with one line stating the scope, e.g. `Review 範圍：增量（<REVIEW BASE 前 7 碼>..<HEAD SHA 前 7 碼>）`
              or `Review 範圍：完整 PR`.
            - End the comment with exactly this line, on its own line, using the real HEAD SHA:
              <!-- claude-reviewed: ${{ github.event.pull_request.head.sha }} -->
            - This marker is how the next run finds its incremental base. It is mandatory in every
              summary comment, including when there is nothing to fix.
          claude_args: |
            --max-turns 16
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh run list:*),Bash(git diff:*),Bash(git show:*),Bash(git log:*),Bash(git merge-base:*),mcp__github_inline_comment__create_inline_comment"
