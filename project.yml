name: EorzeaToolkit
options:
  bundleIdPrefix: com.willchen.eorzeaToolkit
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: zh-Hant
    DEVELOPMENT_TEAM: "4YL95KDQ6V"
    CODE_SIGN_STYLE: Automatic

packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: 8.9.0
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: 1.26.2

targets:
  EorzeaToolkit:
    type: application
    platform: iOS
    sources:
      - path: EorzeaToolkit
    dependencies:
      - package: Kingfisher
      - package: ComposableArchitecture
      # FoundationModels exists from iOS 26 on. Linked weakly so the app still launches on
      # iOS 18–25, where every use of it sits behind an availability check.
      - sdk: FoundationModels.framework
        weak: true
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "艾歐澤亞工具箱"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.willchen.eorzeaToolkit
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - EorzeaToolkitTests

  EorzeaToolkitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EorzeaToolkitTests
      # The held-out runs' sentences, replayed by ItemQueryHoldoutRegressionTests.
      - path: Tools/ItemQueryEval/holdout-1.json
        buildPhase: resources
      - path: Tools/ItemQueryEval/holdout-2.json
        buildPhase: resources
    dependencies:
      # Also makes XcodeGen set TEST_HOST/BUNDLE_LOADER, so tests can reach app code.
      - target: EorzeaToolkit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.willchen.eorzeaToolkit.tests

  EorzeaToolkitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EorzeaToolkitUITests
    dependencies:
      - target: EorzeaToolkit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.willchen.eorzeaToolkit.uitests

  # Evaluates the on-device model's item query parsing on the Mac (prompts/item-query-eval.md).
  # Run it with scripts/run_item_query_eval.sh; CI neither builds nor runs it.
  ItemQueryEval:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tools/ItemQueryEval
        excludes:
          - "*.json"
      # The parsing code and the models it needs: the app's own files, not copies.
      - path: EorzeaToolkit/ItemQuery
      - path: EorzeaToolkit/Models/Item.swift
      - path: EorzeaToolkit/Models/ItemJobFilterOption.swift
      - path: EorzeaToolkit/Models/XIVIconURL.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willchen.eorzeaToolkit.itemQueryEval
    scheme:
      # Running from Xcode starts in DerivedData; point the tool at the repository.
      commandLineArguments:
        "--root=$(SRCROOT)": true

# Opt-in UI regression suite; the main scheme keeps its existing unit-only contract.
schemes:
  EorzeaToolkitUI:
    build:
      targets:
        EorzeaToolkit: all
    test:
      config: Debug
      targets:
        - name: EorzeaToolkitUITests
          parallelizable: false
